<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Французская защита — тренажёр за чёрных</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Inter:wght@400;600&display=swap">
<style>
:root{--bg:#eef2f7;--panel:#fff;--ink:#16233a;--mute:#5d6b82;--light:#dde6f0;--dark:#6f93b8;--ok:#2e9e6a;--bad:#d1495b;--hint:#e8b923;--line:#c9d4e2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1826;--panel:#17233a;--ink:#e8eef7;--mute:#97a6bd;--light:#b9c9dc;--dark:#4a6a90;--line:#2a3b58}}
html{scroll-padding-top:env(safe-area-inset-top,0px);scrollbar-gutter:stable}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px;display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media(min-width:820px){.wrap{grid-template-columns:minmax(0,520px) minmax(0,1fr)}}
h1{font:700 28px/1.15 Fraunces,Georgia,serif;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 12px;font-size:14px}
#board{position:relative;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));aspect-ratio:1;width:100%;border:3px solid var(--ink);border-radius:4px;overflow:hidden;user-select:none;touch-action:none}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%);color:#0d1626;line-height:1;font-family:"Segoe UI Symbol","Noto Sans Symbols 2",serif}
.sq{position:relative;min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:clamp(28px,8.2vw,56px);line-height:1}
.sq.l{background:var(--light)}.sq.d{background:var(--dark)}
.sq .p{pointer-events:none;font-family:"Segoe UI Symbol","Noto Sans Symbols 2",serif}
.sq .p.w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 0 1px #000}
.sq .p.b{color:#0d1626}
.sq.sel{box-shadow:inset 0 0 0 4px var(--hint)}
.sq.last::after{content:"";position:absolute;inset:0;background:rgba(232,185,35,.35)}
.sq.hint{box-shadow:inset 0 0 0 4px var(--ok)}
.sq.bad{animation:sh .35s;box-shadow:inset 0 0 0 4px var(--bad)}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.co{position:absolute;font:600 10px Inter,sans-serif;opacity:.7;pointer-events:none}
.co.r{top:2px;left:3px}.co.f{bottom:1px;right:3px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
label{font-size:13px;color:var(--mute);display:block;margin-bottom:4px}
select,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
select{width:100%}
button{cursor:pointer;font-weight:600}
button:hover{border-color:var(--dark)}
button.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:focus-visible{outline:3px solid var(--hint);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.chk{display:flex;gap:6px;align-items:center;font-size:14px}
#status{font-weight:600;min-height:4.5em}
#status.ok{color:var(--ok)}#status.bad{color:var(--bad)}
#idea{font-size:15px;line-height:1.45;margin:8px 0 0;min-height:6.5em}
#moves{font:600 15px/1.2 Inter,system-ui,sans-serif;min-height:7em;max-height:18em;overflow:auto;border-radius:8px}
.mr{display:grid;grid-template-columns:2.6em 1fr 1fr;align-items:center}
.mr:nth-child(odd){background:rgba(127,127,127,.12)}
.mn{color:var(--mute);padding:7px 8px}
.mv{padding:7px 8px;border-radius:6px;min-height:2.2em}
.mv.cur{background:var(--ink);color:var(--bg)}
.fg{font-style:normal;margin-right:4px;font-size:1.15em}
.stat{font-size:13px;color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">
 <div>
  <h1>Французская защита</h1>
  <p class="sub">Тренажёр за чёрных: 1.e4 e6 2.d4 d5</p>
  <div id="board" role="grid" aria-label="Шахматная доска"></div>
 </div>
 <div>
  <div class="card">
   <label for="line">Вариант</label>
   <select id="line"></select>
   <div class="row">
    <button class="pri" id="start">Начать</button>
    <button id="hintBtn">Подсказка</button>
    <label class="chk" style="margin:0"><input type="checkbox" id="study"> Режим обучения (ходы подсвечены)</label>
   </div>
  </div>
  <div class="card"><div id="status">Выберите вариант и нажмите «Начать».</div><p id="idea"></p></div>
  <div class="card"><label>Ходы</label><div id="moves"></div></div>
  <div class="card"><label>Ваш прогресс</label><div class="stat" id="stats"></div></div>
 </div>
</div>

const sqi=s=>(8-+s[1])*8+(s.charCodeAt(0)-97);
const name=i=>String.fromCharCode(97+i%8)+(8-Math.floor(i/8));
function parse(s){return s.split(";").filter(Boolean).map(x=>{const[a,c]=x.split("|"),[u,s2]=a.split("/");return{u,s:s2,c:c||""}})}
function build(g){root={ch:[]};g.l.forEach(t=>{let n=root;parse(C+";"+g.p+";"+t).forEach(k=>{let c=n.ch.find(x=>x.u===k.u);if(!c){c={u:k.u,s:k.s,c:k.c,ch:[]};n.ch.push(c)}else if(!c.c)c.c=k.c;n=c})})}
function reset(){board=[];START.split("/").forEach(r=>{for(const c of r){if(+c)for(let k=0;k<+c;k++)board.push("");else board.push(c)}})}
function apply(u){
 const f=sqi(u.slice(0,2)),t=sqi(u.slice(2,4)),p=board[f];
 let cap=!!board[t];
 if(p.toLowerCase()==="k"&&Math.abs(t-f)===2){const r=t>f?[t+1,t-1]:[t-2,t+1];board[r[1]]=board[r[0]];board[r[0]]=""}
 if(p.toLowerCase()==="p"&&f%8!==t%8&&!board[t]){board[t+(p==="P"?8:-8)]="";cap=true}
 board[t]=p;board[f]="";lastSq=[f,t];return cap;
}

function snd(k){if(k===2)return;try{const a=new Audio(k===1?SNDC:SND);a.play().catch(()=>{})}catch(e){}}
function draw(){
 const b=$("board");b.innerHTML="";
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){
  const i=(7-r)*8+(7-c);
  const d=document.createElement("div");
  d.className="sq "+(((Math.floor(i/8)+i%8)%2)?"d":"l");
  if(sel===i)d.classList.add("sel");
  if(lastSq.includes(i))d.classList.add("last");
  if(hintSq&&hintSq.includes(i))d.classList.add("hint");
  d.dataset.i=i;d.setAttribute("role","gridcell");d.setAttribute("aria-label",name(i));
  const p=board[i];
  if(p){const s=document.createElement("span");s.className="p "+(p===p.toUpperCase()?"w":"b");s.textContent=GL[p.toUpperCase()]+"\uFE0E";d.appendChild(s)}
  if(c===0){const e=document.createElement("span");e.className="co r";e.textContent=8-Math.floor(i/8);d.appendChild(e)}
  if(r===7){const e=document.createElement("span");e.className="co f";e.textContent=String.fromCharCode(97+i%8);d.appendChild(e)}
  d.onclick=()=>click(i);b.appendChild(d);
 }
}
function setStatus(t,k){const s=$("status");s.textContent=t;s.className=k||""}
const FIG={N:"♞",B:"♝",R:"♜",Q:"♛",K:"♚"};
function fig(s){const f=FIG[s[0]];return f?`<i class="fg">${f}\uFE0E</i>${s.slice(1)}`:s}
function renderMoves(){
 let h="";const last=path.length-1;
 for(let i=0;i<path.length;i+=2){
  const a=path[i],b=path[i+1];
  h+=`<div class="mr"><b class="mn">${i/2+1}</b><span class="mv${i===last?" cur":""}">${fig(a.s)}</span><span class="mv${i+1===last?" cur":""}">${b?fig(b.s):""}</span></div>`;
 }
 $("moves").innerHTML=h;$("moves").scrollTop=1e5;
}
function refresh(){
 hintSq=(!over&&$("study").checked&&path.length%2===1)?node.ch.flatMap(m=>[sqi(m.u.slice(0,2)),sqi(m.u.slice(2,4))]):null;
 draw();renderMoves();
}
function play(n){
 arrows=[];snd(apply(n.u)?1:0);path.push(n);node=n;
 $("idea").textContent=n.c?n.s+" — "+n.c:"";
}
function finish(){
 over=true;hintSq=null;
 const st=load();st[cur.n]=(st[cur.n]||0)+1;save(st);
 setStatus("Вариант пройден! Отлично.","ok");
 $("idea").textContent+=" Идея варианта: "+cur.d;
 refresh();showStats();
}
function step(){
 if(over)return;
 if(!node.ch.length){finish();return}
 if(path.length%2===0){
  busy=true;refresh();
  setTimeout(()=>{
   play(node.ch[Math.floor(Math.random()*node.ch.length)]);busy=false;
   if(!node.ch.length){finish();return}
   setStatus("Ваш ход за чёрных.");refresh()},450);
 }else{setStatus("Ваш ход за чёрных.");refresh()}
}
function click(i){
 if(over||busy||path.length%2===0)return;
 const mine=j=>board[j]&&board[j]===board[j].toLowerCase();
 if(sel===null){if(mine(i)){sel=i;draw()}return}
 if(i===sel){sel=null;draw();return}
 if(mine(i)){sel=i;draw();return}
 const u=name(sel)+name(i),m=node.ch.find(x=>x.u===u);
 if(m){
  sel=null;play(m);setStatus("Верно: "+m.s,"ok");
  if(!node.ch.length){finish();return}
  step();
 }else{
  sel=null;draw();
  const el=document.querySelector(`[data-i="${i}"]`);if(el)el.classList.add("bad");
  const s=load();s.err=(s.err||0)+1;save(s);
  setStatus("Это не теоретический ход. Попробуйте ещё раз или нажмите «Подсказка».","bad");
  showStats();
 }
}
// Стрелки и кружки: правая кнопка мыши (Shift — красная, Ctrl — синяя, Alt — жёлтая)
let arrows=[],aDown=null,aPrev=null;
const ACOL={g:"#15781b",r:"#c0392b",b:"#1f5fbf",y:"#e68f00"};
const xy=i=>[7-i%8+.5,7-Math.floor(i/8)+.5];
function drawArrows(){
 const b=$("board"),o=b.querySelector("svg.ar");if(o)o.remove();
 const list=aPrev?arrows.concat([aPrev]):arrows;if(!list.length)return;
 let h="";
 list.forEach(a=>{
  const[x1,y1]=xy(a.f),[x2,y2]=xy(a.t),c=ACOL[a.c];
  if(a.f===a.t){h+=`<circle cx="${x1}" cy="${y1}" r=".45" fill="none" stroke="${c}" stroke-width=".07" opacity=".8"/>`;return}
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,ex=x2-ux*.38,ey=y2-uy*.38;
  h+=`<g fill="${c}" stroke="${c}" opacity=".8"><line x1="${x1+ux*.2}" y1="${y1+uy*.2}" x2="${ex}" y2="${ey}" stroke-width=".16" stroke-linecap="round"/><polygon stroke="none" points="${x2},${y2} ${ex-uy*.17},${ey+ux*.17} ${ex+uy*.17},${ey-ux*.17}"/></g>`;
 });
 b.insertAdjacentHTML("beforeend",`<svg class="ar" viewBox="0 0 8 8" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5">${h}</svg>`);
}
const _draw=draw;draw=function(){_draw();drawArrows()};
const sqAt=e=>{const t=document.elementFromPoint(e.clientX,e.clientY),s=t&&t.closest(".sq");return s?+s.dataset.i:null};
$("board").addEventListener("contextmenu",e=>e.preventDefault());
$("board").addEventListener("pointerdown",e=>{
 if(e.button!==2)return;e.preventDefault();
 const i=sqAt(e);if(i===null)return;
 aDown={f:i,c:e.shiftKey?"r":e.ctrlKey?"b":e.altKey?"y":"g"};
});
window.addEventListener("pointermove",e=>{if(!aDown)return;const i=sqAt(e);if(i===null)return;aPrev={f:aDown.f,t:i,c:aDown.c};drawArrows()});
window.addEventListener("pointerup",e=>{
 if(!aDown||e.button!==2)return;
 const i=sqAt(e),d=aDown;aDown=null;aPrev=null;
 if(i!==null){
  const k=arrows.findIndex(a=>a.f===d.f&&a.t===i);
  if(k>=0){const same=arrows[k].c===d.c;arrows.splice(k,1);if(!same)arrows.push({f:d.f,t:i,c:d.c})}
  else arrows.push({f:d.f,t:i,c:d.c});
 }
 drawArrows();
});
let drag=null;
$("board").addEventListener("pointerdown",e=>{
 if(e.button!==0)return;arrows=[];drawArrows();
 const sq=e.target.closest(".sq");if(!sq||over||busy||path.length%2===0)return;
 const i=+sq.dataset.i,p=board[i];
 if(!p||p!==p.toLowerCase())return;
 drag={from:i,x:e.clientX,y:e.clientY,moved:false,ghost:null,size:sq.offsetWidth,glyph:sq.querySelector(".p").textContent};
});
window.addEventListener("pointermove",e=>{
 if(!drag)return;
 if(!drag.moved){
  if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;
  drag.moved=true;sel=drag.from;draw();
  const o=document.querySelector('[data-i="'+drag.from+'"] .p');if(o)o.style.opacity=.3;
  const g=document.createElement("div");g.className="ghost";g.textContent=drag.glyph;g.style.fontSize=(drag.size*.85)+"px";
  document.body.appendChild(g);drag.ghost=g;
 }
 drag.ghost.style.left=e.clientX+"px";drag.ghost.style.top=e.clientY+"px";
});
window.addEventListener("pointerup",e=>{
 if(!drag)return;
 const d=drag;drag=null;
 if(!d.moved)return;
 d.ghost.remove();
 const t=document.elementFromPoint(e.clientX,e.clientY),sq=t&&t.closest(".sq");
 if(sq&&+sq.dataset.i!==d.from){sel=d.from;click(+sq.dataset.i)}else{sel=null;draw()}
});
window.addEventListener("pointercancel",()=>{if(drag){if(drag.ghost)drag.ghost.remove();drag=null;sel=null;draw()}});
function load(){try{return JSON.parse(localStorage.getItem("fr-trainer")||"{}")}catch(e){return{}}}
function save(s){try{localStorage.setItem("fr-trainer",JSON.stringify(s))}catch(e){}}
function showStats(){
 const s=load();
 $("stats").innerHTML=G.map(l=>`${l.n}: пройден ${s[l.n]||0} раз`).join("<br>")+`<br>Ошибок всего: ${s.err||0}`;
}
function begin(){
 const v=$("line").value;
 cur=v==="r"?G[Math.floor(Math.random()*G.length)]:G[+v];
 arrows=[];build(cur);reset();node=root;path=[];sel=null;over=false;lastSq=[];busy=false;
 $("idea").textContent=v==="r"?"Вариант выбран случайно: поймите его по ходам белых.":"";
 step();
}
$("start").onclick=begin;
$("hintBtn").onclick=()=>{
 if(over||busy||path.length%2===0)return;
 hintSq=[sqi(node.ch[0].u.slice(0,2))];draw();
 setStatus("Подсказка: ходите фигурой с зелёной клетки.","");
};
$("study").onchange=refresh;
$("line").innerHTML=G.map((l,i)=>`<option value="${i}">${l.n}</option>`).join("")+'<option value="r">Случайный вариант</option>';
reset();draw();showStats();
</script>
